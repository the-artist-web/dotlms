<body>
    
    <article class="auth-page">

        <div class="auth-banner">

            <div class="auth-content">
                <div class="icon-big">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-school"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M22 9l-10 -4l-10 4l10 4l10 -4v6" /><path d="M6 10.6v5.4a6 3 0 0 0 12 0v-5.4" /></svg>
                </div>
    
                <div class="wrapper-block">
                    <h2 class="text-headline-medium">ابدأ التعلم اليوم</h2>
    
                    <p class="text-body-large opacity-75">يمكنك الوصول إلى مقرراتك الدراسية، وتتبع تقدمك، وتحقيق التميز الأكاديمي.</p>
                </div>
            </div>

        </div>

        <div class="auth-form">

            <a href="../../index.html" class="logo medium">
                <img src="../../src/assets/images/logo.png" alt="Lms" loading="lazy" class="img-logo img-cover" />
            </a>

            <div class="wrapper-block">
                <h2 class="text-headline-medium">مرحبًا بعودتك</h2>

                <p class="text-body-large text-on-background-variant">أدخل بيانات اعتمادك للوصول إلى حسابك</p>
            </div>

            <form action="" method="POST" class="auth-card">

                <div class="form-group">
                    <label for="email" class="text-body-medium">عنوان البريد الإلكتروني</label>
                    
                    <div class="input-wrapper outline medium">
                        <input type="email" placeholder="أدخل عنوان البريد الإلكتروني" name="" value="" class="text-body-large" id="email" required />
                    </div>

                    <!-- <p class="text-error text-body-medium"></p> -->
                </div>

                <div class="form-group">
                    <label for="password" class="text-body-medium">كلمة المرور</label>
                    
                    <div class="input-wrapper outline medium p-end-0" data-passwords>
                        <input type="password" placeholder="أدخل كلمة المرور" name="" value="" class="text-body-large" id="password" required />

                        <button type="button" class="icon-btn text medium" data-bs-toggle="tooltip" data-bs-title="اظهار كلمة المرور" data-bs-placement="bottom">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-eye"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M10 12a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" /><path d="M21 12c-2.4 4 -5.4 6 -9 6c-3.6 0 -6.6 -2 -9 -6c2.4 -4 5.4 -6 9 -6c3.6 0 6.6 2 9 6" /></svg>

                            <div class="state-layer"></div>
                        </button>
                    </div>

                    <!-- <p class="text-error text-body-medium"></p> -->
                </div>

                <button type="submit" class="btn filled medium w-full">
                    <p class="text-body-large">تسجيل الدخول</p>

                    <div class="state-layer"></div>
                </button>

                <p class="text-center text-on-background-variant text-body-medium">
                    ليس لديك حساب؟

                    <a href="../../pages/auth/register.html" class="hover text-on-background">إنشاء حساب</a>
                </p>

            </form>

        </div>

    </article>

</body>

</html>
